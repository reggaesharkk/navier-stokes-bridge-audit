name: Temporary Gevrey majorant audit

on:
  push:
    paths:
      - ".github/workflows/temp_gevrey_majorant.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gevrey-uniform-majorant-20260925
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy
      - name: Run Gevrey majorant audit
        run: python src/gevrey_uniform_majorant_gate.py --lattice-radius 40
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: gevrey_uniform_majorant_results
          path: src/gevrey_uniform_majorant_results.json
          if-no-files-found: error
