name: Temporary WP12 Colab bundle
# fast packaging run with sparse H2 smoke test

on:
  push:
    paths:
      - ".github/workflows/temp_wp12_bundle.yml"

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wp12-energy-coefficient-falsifier-20260925
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy
      - name: Build bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bundle/notebooks bundle/src bundle/notes
          cp notebooks/WP12_energy_coefficient_colab.ipynb bundle/notebooks/
          cp src/wp12_energy_coefficient_falsifier.py bundle/src/
          cp src/wp12_energy_coefficient_verified_summary.json bundle/src/
          cp notes/WP12_ENERGY_COEFFICIENT_FALSIFIER_2026_09_25.md bundle/notes/
          python3 src/wp12_energy_coefficient_falsifier.py --t-end 0 --output bundle/src/wp12_smoke_results.json
          cat > bundle/README.txt <<'EOF'
          WP12 Energy-Level Coefficient Falsifier — Colab Bundle
          Repository: reggaesharkk/navier-stokes-bridge-audit
          Branch: wp12-energy-coefficient-falsifier-20260925
          Purpose: falsification infrastructure for the open WP11 L2-L3 target.
          The C*sqrt(G) coefficient is analytically rejected in the included note.
          The notebook and numerical results are finite-cutoff diagnostics only.
          EOF
          cd bundle
          find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: WP12_energy_coefficient_Colab_bundle
          path: bundle/
          if-no-files-found: error
          compression-level: 9
