name: Temporary WP16 expanded Colab bundle

on:
  push:
    paths:
      - ".github/workflows/temp_wp16_expanded_bundle.yml"

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wp16-expanded-colab-phase-search-20260925
      - name: Build bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bundle/notebooks bundle/src bundle/notes
          cp notebooks/WP16_expanded_phase_torus_colab.ipynb bundle/notebooks/
          cp src/wp16_expanded_phase_search.py bundle/src/
          cp src/wp16_structured_phase_adversary_verified_summary.json bundle/src/
          cp notes/WP16_STRUCTURED_PHASE_ADVERSARY_GATE_2026_09_25.md bundle/notes/
          cat > bundle/README.txt <<'EOF'
          WP16 Expanded Phase-Torus Colab Bundle
          Repository: reggaesharkk/navier-stokes-bridge-audit
          Purpose: larger finite adversarial phase search against the WP15 positive-stretching coefficient.
          Locked registered WP16 benchmark: C_infinity_stretch = 1.077899704172086.
          The search preserves modal magnitudes, polarizations, reality and divergence freedom.
          A larger finite result does not prove divergence; a bounded finite result does not prove a universal bound.
          EOF
          cd bundle
          find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: WP16_expanded_phase_torus_Colab_bundle
          path: bundle/
          if-no-files-found: error
          compression-level: 9
