name: WP19 v0.28 goal-weighted primal uncertainty step 237
on:
  push:
    branches: [wp19-v0-28-m14-fullpath-cert]
    paths:
      - '.github/workflows/wp19_v0_28_goal_weighted_step237.yml'
      - 'src/wp19_v0_28_goal_weighted_primal_uncertainty_step237.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  goal-weighted-step237:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen arithmetic dependencies
        run: python -m pip install numpy==2.3.5 python-flint==0.8.0
      - name: Download and verify frozen lower and adjoint paths
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p work/lower work/adjoint output
          fetch_artifact() {
            local endpoint="$1"
            local destination="$2"
            local attempt=0
            until gh api "$endpoint" > "$destination"; do
              attempt=$((attempt + 1))
              if (( attempt >= 6 )); then return 1; fi
              sleep $((attempt * 5))
            done
          }
          fetch_artifact "repos/${GITHUB_REPOSITORY}/actions/artifacts/11059294923/zip" work/lower.zip
          fetch_artifact "repos/${GITHUB_REPOSITORY}/actions/artifacts/11121015458/zip" work/adjoint.zip
          echo 'b0bb454fa320887c2b17dfd8a0bae916273253bb057ecff7acee3d6218234698  work/lower.zip' | sha256sum -c -
          echo '330bb3e931fa8d45d1837c090b13a4a638fb54577cb26b8d8eaa2fe009303058  work/adjoint.zip' | sha256sum -c -
          unzip -q work/lower.zip -d work/lower
          unzip -q work/adjoint.zip -d work/adjoint
      - name: Compute goal-weighted primal uncertainty bound
        run: |
          set -euo pipefail
          python src/wp19_v0_28_adjoint_segment_arb.py --self-check
          python src/wp19_v0_28_goal_weighted_primal_uncertainty_step237.py \
            --lower-dir work/lower --adjoint-dir work/adjoint \
            --segment results/wp19_v0_28/pilot_chained_237_36820757066/M14_segment_237.json \
            --output output/step237_goal_weighted_primal_uncertainty.json
      - uses: actions/upload-artifact@v4
        with:
          name: wp19-v0-28-M14-goal-weighted-primal-uncertainty-step-237
          path: output/step237_goal_weighted_primal_uncertainty.json
          if-no-files-found: error
          retention-days: 90
