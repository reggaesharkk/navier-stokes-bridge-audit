name: Temporary exact research package

on:
  push:
    paths:
      - ".github/workflows/temp_exact_package.yml"

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: 6a559367d5f97d1cbe7321fd5cd4000b1d872fb5
          fetch-depth: 1

      - name: Export exact tracked tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir package
          git archive 6a559367d5f97d1cbe7321fd5cd4000b1d872fb5 | tar -x -C package

          cat > package/PACKAGE_METADATA.txt <<'EOF'
          Navier-Stokes Bridge Audit — Exact Research Package
          Repository: reggaesharkk/navier-stokes-bridge-audit
          Branch snapshot: main
          Exact Git commit: 6a559367d5f97d1cbe7321fd5cd4000b1d872fb5
          Packaged after merged PR #21
          Package date: 2026-09-25
          Scope: Complete tracked repository tree at the exact commit above.
          Integrity: SHA256SUMS_COMPLETE.txt contains SHA-256 for every package file
          except SHA256SUMS_COMPLETE.txt itself.
          EOF

      - name: Generate and verify SHA-256 manifest
        shell: bash
        run: |
          set -euo pipefail
          cd package
          find . -type f ! -name SHA256SUMS_COMPLETE.txt -print0 \
            | sort -z \
            | xargs -0 sha256sum > SHA256SUMS_COMPLETE.txt
          sha256sum -c SHA256SUMS_COMPLETE.txt

      - name: Upload exact package
        uses: actions/upload-artifact@v4
        with:
          name: Navier_Stokes_Bridge_Audit_MAIN_6a559367_SHA256
          path: package/
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 9
