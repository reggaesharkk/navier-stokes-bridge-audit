name: Temporary WP16 expanded smoke test

on:
  push:
    paths:
      - ".github/workflows/temp_wp16_expanded_smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wp16-expanded-colab-phase-search-20260925
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy
      - name: Run tiny expanded WP16 smoke test
        run: |
          python3 src/wp16_expanded_phase_search.py             --cutoffs 5             --anchor-times 0.0025             --seeds 20260925             --global-draws 2             --block-rounds 1             --block-trials 4             --block-size 4             --grid 24             --output /tmp/wp16_expanded_smoke.json
      - uses: actions/upload-artifact@v4
        with:
          name: wp16_expanded_smoke
          path: /tmp/wp16_expanded_smoke.json
          if-no-files-found: error
