name: Temporary WP14 endpoint geometry audit

on:
  push:
    paths:
      - ".github/workflows/temp_wp14_geometry.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wp14-endpoint-geometry-coupling-20260925
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy
      - name: Run WP14
        run: python3 src/wp14_endpoint_geometry_coupling.py
      - uses: actions/upload-artifact@v4
        with:
          name: wp14_endpoint_geometry_results
          path: src/wp14_endpoint_geometry_results.json
          if-no-files-found: error
