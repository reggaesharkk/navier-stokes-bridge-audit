name: WP19 v0.28 independent residual recheck for frozen steps 237-239
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/wp19_v0_28_verify_residual_bound_chain.py'
      - '.github/workflows/wp19_v0_28_independent_residual_chain.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  residual-check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - step: 239
            segment: results/wp19_v0_28/pilot_v2_36818369196/M14_segment_239.json
          - step: 238
            segment: results/wp19_v0_28/pilot_chained_238_36819581437/M14_segment_238.json
          - step: 237
            segment: results/wp19_v0_28/pilot_chained_237_36820757066/M14_segment_237.json
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.3.5 python-flint==0.8.0
      - name: Independent convolution helper self-test
        run: python src/wp19_v0_28_verify_residual_bound_chain.py --self-check
      - name: Retrieve frozen N14 certificate artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p work/lower output
          gh api repos/${{ github.repository }}/actions/artifacts/11059294923/zip > work/lower.zip
          echo 'b0bb454fa320887c2b17dfd8a0bae916273253bb057ecff7acee3d6218234698  work/lower.zip' | sha256sum -c -
          unzip -q work/lower.zip -d work/lower
      - name: Retrieve frozen adjoint path artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p work/adjoint
          gh api repos/${{ github.repository }}/actions/artifacts/11120698789/zip > work/adjoint.zip
          echo 'ef3ff8cca997b783b8a065072cce1d2793e9940d2f7db89076afffcc2298a13b  work/adjoint.zip' | sha256sum -c -
          unzip -q work/adjoint.zip -d work/adjoint
          report_path=$(find work/adjoint -name M14_arb_vjp_point.json -print -quit)
          test -n "$report_path"
          echo "ADJOINT_DIR=$(dirname "$report_path")" >> "$GITHUB_ENV"
      - name: Independently reconstruct the full segment residual
        run: |
          set -euo pipefail
          python src/wp19_v0_28_verify_residual_bound_chain.py \
            --step "${{ matrix.step }}" \
            --lower-dir work/lower \
            --adjoint-dir "$ADJOINT_DIR" \
            --segment "${{ matrix.segment }}" \
            --output "output/independent_residual_${{ matrix.step }}.json"
      - name: Hash output bundle
        if: always()
        run: |
          set -euo pipefail
          cp src/wp19_v0_28_verify_residual_bound_chain.py output/
          python - <<'PY'
          import hashlib
          from pathlib import Path
          root=Path('output')
          files=sorted(p for p in root.iterdir() if p.is_file() and p.name!='SHA256SUMS.txt')
          (root/'SHA256SUMS.txt').write_text(''.join(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n' for p in files))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wp19-v0-28-independent-residual-${{ matrix.step }}
          path: output
          if-no-files-found: error
          retention-days: 90
