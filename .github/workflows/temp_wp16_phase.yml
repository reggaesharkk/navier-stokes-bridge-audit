name: Temporary WP16 phase adversary
# evolved cascade-support coordinate adversary

on:
  push:
    paths:
      - ".github/workflows/temp_wp16_phase.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wp16-structured-phase-adversary-20260925
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy
      - name: Run WP16 phase adversary
        run: python3 src/wp16_structured_phase_adversary.py --anchor evolved --random-draws 0 --local-rounds 4 --local-trials 96
      - uses: actions/upload-artifact@v4
        with:
          name: wp16_structured_phase_adversary_results
          path: src/wp16_structured_phase_adversary_results.json
          if-no-files-found: error
