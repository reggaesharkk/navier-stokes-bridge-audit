name: Temporary WP12 energy coefficient audit

on:
  push:
    paths:
      - ".github/workflows/temp_wp12_energy.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wp12-energy-coefficient-falsifier-20260925
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy
      - name: Run WP12 energy coefficient falsifier
        run: python3 src/wp12_energy_coefficient_falsifier.py
      - uses: actions/upload-artifact@v4
        with:
          name: wp12_energy_coefficient_results
          path: src/wp12_energy_coefficient_results.json
          if-no-files-found: error
