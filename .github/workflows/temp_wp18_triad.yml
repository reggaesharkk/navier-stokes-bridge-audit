name: Temporary WP18 isolated triad audit

on:
  push:
    paths:
      - ".github/workflows/temp_wp18_triad.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wp18-isolated-triad-limit-20260925
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy
      - name: Run WP18
        run: python3 src/wp18_isolated_triad_limit.py
      - uses: actions/upload-artifact@v4
        with:
          name: wp18_isolated_triad_limit_results
          path: src/wp18_isolated_triad_limit_results.json
          if-no-files-found: error
