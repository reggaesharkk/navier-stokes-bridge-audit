name: Temporary WP13 endpoint audit
# optimized spatial reuse

on:
  push:
    paths:
      - ".github/workflows/temp_wp13_endpoint.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wp13-endpoint-vorticity-gate-20260925
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy
      - name: Run WP13
        run: python3 src/wp13_endpoint_vorticity_gate.py
      - uses: actions/upload-artifact@v4
        with:
          name: wp13_endpoint_vorticity_results
          path: src/wp13_endpoint_vorticity_results.json
          if-no-files-found: error
